dependencies:
  # mDNS left core IDF in v5.0 and is now a managed component.  Pinned to a
  # minor range so a build is reproducible without freezing out patch fixes.
  espressif/mdns: "^1.2.0"
  # Drives the WS2812 pixel that most C5 and C6 boards carry in place of a
  # plain LED.  Depended on unconditionally rather than per target, because the
  # LED backend is a Kconfig choice: any board could be wired either way.
  espressif/led_strip: "^3.0.0"
  # The ILI9341 panel driver; the ST7789 one ships inside esp_lcd. Pulled in
  # for every target for the same reason as the LED strip: the panel is a
  # Kconfig choice, and a component that is not selected costs a build
  # nothing beyond the download.
  #
  # Both are pulled in only for the chip that carries a panel here, because
  # their own manifests name the targets they support and the 3.5" board's
  # driver does not list the C5 or the C6: asking for it there fails dependency
  # solving before a line is compiled. Locally that hid behind a cached
  # component and only CI, which resolves from scratch, saw it.
  espressif/esp_lcd_ili9341:
    version: "^1.2.0"
    rules:
      - if: "target == esp32"
  espressif/esp_lcd_st7796:
    version: "^1.2.0"
    rules:
      - if: "target == esp32"
  # The QSPI AMOLED driver, which handles both the SH8601 and the CO5300
  # behind the same entry points. S3 only, for the same reason as the two
  # above: its manifest names the targets it supports.
  espressif/esp_lcd_sh8601:
    version: "^1.0.0"
    rules:
      - if: "target == esp32s3"

  idf:
    version: ">=5.0"
