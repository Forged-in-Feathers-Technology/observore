<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argus</title>
<style>
  :root {
    --bg: #0d0f12; --panel: #16191f; --line: #262b33;
    --fg: #e6e9ef; --dim: #8b93a1;
    --clear: #3fb950; --caution: #d29922; --alert: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    padding: 16px; max-width: 900px; margin-inline: auto;
  }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
  h1 { font-size: 18px; margin: 0; letter-spacing: 0.12em; text-transform: uppercase; }
  .sub { color: var(--dim); font-size: 12px; }
  .banner {
    border: 1px solid var(--line); border-left-width: 4px;
    background: var(--panel); border-radius: 6px;
    padding: 14px 16px; margin-bottom: 16px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .banner.clear   { border-left-color: var(--clear); }
  .banner.caution { border-left-color: var(--caution); }
  .banner.alert   { border-left-color: var(--alert); }
  .level { font-size: 20px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
  .clear .level { color: var(--clear); }
  .caution .level { color: var(--caution); }
  .alert .level { color: var(--alert); }
  .stats { display: flex; gap: 20px; flex-wrap: wrap; color: var(--dim); font-size: 12px; }
  .stats b { color: var(--fg); font-weight: 600; }
  .wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
  table { border-collapse: collapse; width: 100%; min-width: 640px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { background: var(--panel); color: var(--dim); font-weight: 600; font-size: 11px;
       text-transform: uppercase; letter-spacing: 0.06em; position: sticky; top: 0; }
  tr:last-child td { border-bottom: 0; }
  .tag { padding: 1px 7px; border-radius: 10px; font-size: 11px; border: 1px solid var(--line); }
  .t-bodycam, .t-alpr, .t-follower { color: var(--alert); border-color: var(--alert); }
  .t-tracker, .t-drone, .t-smart-glasses { color: var(--caution); border-color: var(--caution); }
  .t-camera, .t-fleet-telematics { color: var(--dim); }
  .dim { color: var(--dim); }
  .empty { padding: 28px; text-align: center; color: var(--dim); }
  button {
    background: var(--panel); color: var(--fg); border: 1px solid var(--line);
    border-radius: 5px; padding: 6px 12px; font: inherit; font-size: 12px; cursor: pointer;
  }
  button:hover { border-color: var(--dim); }
  footer { margin-top: 14px; display: flex; justify-content: space-between;
           align-items: center; color: var(--dim); font-size: 11px; gap: 10px; }
  .mini { padding: 2px 8px; font-size: 11px; }
  .panel { margin-top: 16px; border: 1px solid var(--line); border-radius: 6px;
           background: var(--panel); padding: 12px 14px; }
  .panel h2 { font-size: 11px; margin: 0 0 10px; color: var(--dim);
              text-transform: uppercase; letter-spacing: 0.06em; }
  .rules { display: flex; flex-wrap: wrap; gap: 6px; }
  .rule { display: inline-flex; align-items: center; gap: 6px; font-size: 11px;
          border: 1px solid var(--line); border-radius: 12px; padding: 2px 4px 2px 9px; }
  .rule .k { color: var(--dim); }
  .rule button { border: 0; background: none; color: var(--dim); cursor: pointer;
                 font: inherit; padding: 0 4px; line-height: 1; }
  .rule button:hover { color: var(--alert); }
  .add { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  select, input {
    background: var(--bg); color: var(--fg); border: 1px solid var(--line);
    border-radius: 5px; padding: 5px 8px; font: inherit; font-size: 12px;
  }
  input { min-width: 190px; }
</style>
</head>
<body>
<header>
  <h1>Argus</h1>
  <span class="sub" id="uptime"></span>
</header>

<div class="banner clear" id="banner">
  <span class="level" id="level">—</span>
  <div class="stats">
    <span>score <b id="score">0</b></span>
    <span>devices <b id="devices">0</b></span>
    <span>sightings <b id="sightings">0</b></span>
    <span>mode <b id="mode">—</b></span>
  </div>
</div>

<div class="wrap">
  <table>
    <thead>
      <tr>
        <th>class</th><th>label</th><th>mac</th><th>detail</th>
        <th>rssi</th><th>via</th><th>evidence</th><th>hits</th><th>last</th><th></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty">Nothing detected yet.</div>
</div>

<div class="panel">
  <h2>Ignored <span id="muteinfo" class="dim"></span></h2>
  <div class="rules" id="rules"></div>
  <div class="add">
    <select id="kind">
      <option value="mac">this MAC</option>
      <option value="oui">this vendor prefix</option>
      <option value="class">this whole class</option>
      <option value="ssid">SSID containing</option>
    </select>
    <input id="value" placeholder="AA:BB:CC:DD:EE:FF">
    <button id="add">Ignore</button>
  </div>
</div>

<footer>
  <span id="updated">connecting…</span>
  <span>
    <button class="mini" id="unmuteall">Clear ignores</button>
    <button class="mini" id="clear">Clear log</button>
  </span>
</footer>

<script>
const $ = id => document.getElementById(id);

function ago(s) {
  if (s < 60) return s + 's';
  if (s < 3600) return Math.floor(s / 60) + 'm';
  return Math.floor(s / 3600) + 'h';
}

async function refresh() {
  try {
    const [status, devices] = await Promise.all([
      fetch('/api/status').then(r => r.json()),
      fetch('/api/devices').then(r => r.json()),
    ]);

    $('banner').className = 'banner ' + status.level;
    $('level').textContent = status.level;
    $('score').textContent = status.score;
    $('devices').textContent = status.devices;
    $('sightings').textContent = status.sightings;
    $('mode').textContent = status.mode;
    $('uptime').textContent = 'up ' + ago(status.uptime_s);

    const rows = $('rows');
    rows.replaceChildren();
    for (const d of devices.devices) {
      const tr = document.createElement('tr');
      const cells = [
        ['span', 'tag t-' + d.class, d.class],
        ['text', '', d.label],
        ['text', 'dim', d.mac],
        ['text', '', d.detail],
        ['text', '', d.rssi + ' dBm'],
        ['text', 'dim', d.source],
        ['text', 'dim', d.evidence],
        ['text', 'dim', String(d.hits)],
        ['text', 'dim', ago(d.last_seen_s) + ' ago'],
        ['mute', '', d.mac],
      ];
      for (const [kind, cls, value] of cells) {
        const td = document.createElement('td');
        if (kind === 'span') {
          const s = document.createElement('span');
          s.className = cls;
          s.textContent = value;
          td.appendChild(s);
        } else if (kind === 'mute') {
          const b = document.createElement('button');
          b.className = 'mini';
          b.textContent = 'ignore';
          b.title = 'Stop reporting this device';
          b.addEventListener('click', () => mute('mac', value));
          td.appendChild(b);
        } else {
          td.className = cls;
          td.textContent = value;   // textContent, never innerHTML: these are
                                    // strings a stranger's radio chose
        }
        tr.appendChild(td);
      }
      rows.appendChild(tr);
    }
    $('empty').style.display = devices.devices.length ? 'none' : 'block';

    const mutes = await fetch('/api/mutes').then(r => r.json());
    $('muteinfo').textContent = mutes.rules.length
      ? '— ' + mutes.suppressed + ' sightings suppressed'
      : '— nothing ignored yet';
    const rules = $('rules');
    rules.replaceChildren();
    for (const r of mutes.rules) {
      const el = document.createElement('span');
      el.className = 'rule';
      const k = document.createElement('span');
      k.className = 'k';
      k.textContent = r.kind;
      const v = document.createElement('span');
      v.textContent = r.value;
      const x = document.createElement('button');
      x.textContent = '×';
      x.title = 'Stop ignoring';
      x.addEventListener('click', async () => {
        await fetch('/api/unmute?index=' + r.index, { method: 'POST' });
        refresh();
      });
      el.append(k, v, x);
      rules.appendChild(el);
    }
    $('updated').textContent = 'updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    $('updated').textContent = 'connection lost — retrying';
  }
}

async function mute(kind, value) {
  const res = await fetch(
    '/api/mute?' + kind + '=' + encodeURIComponent(value), { method: 'POST' });
  const out = await res.json();
  if (!out.ok) {
    $('updated').textContent = 'ignore failed: ' + out.error;
    return;
  }
  refresh();
}

$('kind').addEventListener('change', () => {
  $('value').placeholder = {
    mac: 'AA:BB:CC:DD:EE:FF',
    oui: 'AA:BB:CC',
    class: 'camera',
    ssid: 'part of an SSID',
  }[$('kind').value];
});

$('add').addEventListener('click', () => {
  const v = $('value').value.trim();
  if (v) { mute($('kind').value, v); $('value').value = ''; }
});

$('unmuteall').addEventListener('click', async () => {
  await fetch('/api/unmute?all=1', { method: 'POST' });
  refresh();
});

$('clear').addEventListener('click', async () => {
  await fetch('/api/clear', { method: 'POST' });
  refresh();
});

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
