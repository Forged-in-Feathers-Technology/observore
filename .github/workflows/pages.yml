name: Flasher page

# Publishes the browser flasher (issue #9).
#
# The firmware is copied into the site rather than linked from the release.
# GitHub's release downloads send no Access-Control-Allow-Origin header, and
# they arrive as application/octet-stream with a content-disposition of
# attachment -- so a browser fetch from the page is blocked by CORS and ESP Web
# Tools cannot read them. Serving the same bytes same-origin avoids all of it,
# and keeps binaries out of the repository.
on:
  release:
    types: [published]
  # The page is not only published with firmware.  Edits to the page itself --
  # wording, browser guidance, flashing instructions -- used to sit unpublished
  # until the next release happened to go out, which meant the site could
  # contradict the repository for weeks.  The firmware served alongside it
  # still comes from the latest release, so this republishes the page without
  # changing what it installs.
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release to publish on the page (default: latest)'
        required: false

# The custom domain, named once. It is written into the artifact as CNAME
# and read back afterwards to prove the deploy took, and those two had no
# business being separate strings.
env:
  SITE: observore.forgedinfeatherstechnology.com

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Assemble the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --repo "${{ github.repository }}" \
                    --json tagName -q .tagName)
          fi
          echo "publishing $TAG"

          mkdir -p _site/firmware
          cp web/index.html _site/index.html

          # Vendor the installer instead of loading it from a CDN at runtime.
          #
          # The page used to pull esp-web-tools from unpkg, pinned to a version
          # that did not exist. unpkg returned 404, the custom element never
          # registered, and an unregistered element renders all of its
          # children -- so every visitor was told their browser could not talk
          # to serial devices. It was wrong in every browser and looked like a
          # browser problem, which is the worst possible way to fail.
          #
          # Fetching it here means a bad version breaks the deploy instead of
          # the site, and visitors never depend on a third party being up.
          EWT_VERSION=10.4.0
          curl -fsSL "https://registry.npmjs.org/esp-web-tools/-/esp-web-tools-${EWT_VERSION}.tgz" \
            -o /tmp/ewt.tgz
          mkdir -p _site/ewt
          tar xzf /tmp/ewt.tgz -C /tmp
          cp -r /tmp/package/dist/web/. _site/ewt/

          # Prove we got a working build rather than an error page: the entry
          # point must exist and must actually register the element the page
          # relies on.
          test -s _site/ewt/install-button.js || {
            echo "::error::esp-web-tools ${EWT_VERSION} has no install-button.js"; exit 1; }
          grep -q 'customElements.define("esp-web-install-button"' \
            _site/ewt/install-button.js || {
            echo "::error::install-button.js does not register esp-web-install-button"; exit 1; }
          echo "vendored esp-web-tools ${EWT_VERSION} ($(ls _site/ewt | wc -l) files)"

          # The page must reference what was actually vendored.
          grep -q 'src="ewt/install-button.js"' _site/index.html || {
            echo "::error::index.html does not load the vendored installer"; exit 1; }

          # Claims the custom domain. Two different things are called CNAME
          # here and only one of them is this: the DNS record at the provider
          # routes the name to GitHub, and this file tells GitHub which of its
          # many Pages sites should answer for it. Without it GitHub receives
          # the request and returns 404.
          #
          # It has to be written by this workflow. With branch-published Pages
          # the repository setting writes the file for you; with Actions
          # publishing, each deploy replaces the whole site, so a file that is
          # not in the artifact disappears on the next run.
          echo "$SITE" > _site/CNAME
          gh release download "$TAG" --repo "${{ github.repository }}" \
             --pattern '*.bin' --dir _site/firmware
          # The per-target fragments carry each chip's real flash offsets, so
          # the page and the release agree by construction instead of by two
          # people remembering to edit both.
          gh release download "$TAG" --repo "${{ github.repository }}" \
             --pattern 'builds-*.json' --dir _site/firmware

          # Same manifest as the release, but with no --base: the parts are
          # fetched from this origin, which is the entire reason the binaries
          # are copied into the site rather than linked.
          python3 tools/make_manifest.py \
            --version "$TAG" --out-dir _site/firmware \
            '_site/firmware/builds-*.json'

          # Every part the manifest promises must actually be on the page. A
          # missing binary is a 404 at flashing time, in a browser, on somebody
          # else's machine -- the worst place to discover it.
          python3 - <<'PY'
          import json, os, sys
          import glob
          index = json.load(open('_site/firmware/boards.json'))
          missing = []
          for entry in index['boards']:
              mpath = os.path.join('_site/firmware', entry['manifest'])
              if not os.path.exists(mpath):
                  missing.append((entry['board'], entry['manifest']))
                  continue
              m = json.load(open(mpath))
              for build in m['builds']:
                  for part in build['parts']:
                      path = os.path.join('_site/firmware', part['path'])
                      if not os.path.exists(path) or os.path.getsize(path) == 0:
                          missing.append((entry['board'], part['path']))
          if missing:
              for board, path in missing:
                  print('::error::%s is missing %s' % (board, path))
              sys.exit(1)
          print('boards offered: ' + ', '.join(e['board'] for e in index['boards']))
          PY
          ls -l _site _site/firmware

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # Prove the site actually changed, rather than trusting that it did.
      #
      # This is here because it silently did not. v0.15.0 was published, the
      # release carried all ten boards, this workflow built the site
      # correctly -- its own log says "wrote boards.json listing 10 boards"
      # -- and the deploy step reported success. The live page served
      # v0.14.0 and nine boards for four hours, with the tenth board's
      # manifest returning 404 to anybody who picked it.
      #
      # The cause is not known, and the first explanation written here was
      # wrong. It said the release deployment had been deduplicated against
      # an earlier one from the same commit -- a `web/**` push had deployed
      # that SHA while v0.15.0 was still a draft, so it correctly served
      # v0.14.0, and the release was tagged at that same commit.
      #
      # That reads well and the evidence refutes it: the workflow_dispatch
      # that eventually fixed the site ran at the *same* commit, 4fa57224,
      # and replaced the content without trouble. A same-SHA deployment can
      # plainly succeed, so being same-SHA is not what stopped the first one.
      #
      # What is known is only this: the deploy reported success, the build
      # log proves the artifact was right, and the bytes being served did
      # not change for four hours.
      #
      # Which is the argument for this step rather than against it. Every
      # signal this workflow produces was green while the thing it exists to
      # publish was wrong. A cause nobody has identified cannot be guarded
      # against at its source; an outcome can be checked whatever caused it.
      # A flasher serving firmware older than the release it claims is the
      # one failure that matters here, and it is one HTTP request away from
      # being provable.
      - name: Read the page back
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --repo "${{ github.repository }}" \
                    --json tagName -q .tagName)
          fi
          URL="https://$SITE/firmware/boards.json"

          # Every failure says which failure it was.
          #
          # The first version of this sent both curl's and python's stderr to
          # /dev/null and reported a bare "unreachable". It then failed on
          # every attempt against a site that was serving HTTP 200 the whole
          # time, and the log could not say whether the fetch or the parse
          # had broken. That is the same fault this project fixed in
          # flashboard.sh, which swallowed build output and cost three
          # rounds of debugging an exit code.
          #
          # Pages takes a little while to serve a new deployment, so this
          # retries -- but it reports each attempt in full.
          last_code=000
          last_seen=""
          for attempt in $(seq 1 20); do
            code=$(curl -sSL -o /tmp/boards.json -w '%{http_code}' \
                   -A 'observore-pages-check' \
                   "$URL?cb=$RANDOM$attempt" 2>/tmp/curl.err) || true
            last_code=${code:-000}
            if [ "$last_code" != "200" ]; then
              echo "attempt $attempt: HTTP ${code:-none} -- $(tr -d '\n' < /tmp/curl.err | head -c 200)"
              sleep 15
              continue
            fi
            got=$(python3 -c 'import sys,json;d=json.load(open("/tmp/boards.json"));print(d["version"],len(d["boards"]))' 2>/tmp/py.err) || true
            if [ -z "$got" ]; then
              echo "attempt $attempt: HTTP 200 but unparseable -- $(tr -d '\n' < /tmp/py.err | head -c 200)"
              echo "  first bytes: $(head -c 120 /tmp/boards.json | tr -d '\n')"
              sleep 15
              continue
            fi
            set -- $got
            last_seen="$1"
            if [ "$1" = "$TAG" ]; then
              echo "::notice::the page serves $1 with $2 boards"
              exit 0
            fi
            echo "attempt $attempt: page serves $1 with $2 boards, want $TAG"
            sleep 15
          done

          # Out of attempts. Which of the two failures was it?
          #
          # They are not the same thing and must not be reported as though
          # they were. A wrong version means the deploy silently did not
          # take, which is what this step exists to catch and is worth
          # failing a release over. Never reaching the page means this step
          # could not run -- and failing every deploy because the guard is
          # broken teaches everyone to ignore it, which costs the guard
          # itself. A check that always fails catches nothing.
          if [ "${last_code:-000}" != "200" ]; then
            echo "::warning::could not read $URL (last status ${last_code:-none})."
            echo "::warning::This guard did NOT run. The deploy is unverified,"
            echo "::warning::not known-bad -- the page may well be correct."
            echo "::warning::Measured 2026-10-18: Cloudflare returns 403 to"
            echo "::warning::GitHub runners for this host while answering every"
            echo "::warning::user agent from a normal address, so it is the"
            echo "::warning::runner's address being refused and not the site"
            echo "::warning::being down. A WAF skip rule for this one path"
            echo "::warning::restores the check."
            exit 0
          fi
          echo "::error::$URL serves $last_seen, not $TAG."
          echo "::error::The deploy reported success and the page did not change."
          echo "::error::This is the failure that shipped v0.15.0 serving v0.14.0."
          exit 1
