name: Release artifacts

# Builds the firmware for a tag and attaches it to the release, together with
# an ESP Web Tools manifest so a browser can flash it (see issue #9).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach to'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.board }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One entry per BOARD, not per chip.
        #
        # ESP Web Tools matches on chipFamily, which distinguishes an S3 from a
        # C5 and cannot distinguish two C5 boards from each other -- and they
        # are not interchangeable. The Waveshare kit has an addressable pixel
        # and a UART bridge; the XIAO has a plain LED on the same pin and only
        # native USB. Installing the wrong one leaves the LED dark and the
        # console talking to hardware that is not there, which is a quiet
        # enough failure to be worth preventing.
        #
        # So the release ships a manifest per board and the page offers a
        # picker. The chip check still runs underneath it.
        include:
          - board: xiao-esp32s3
            target: esp32s3
            profile: ""
          - board: devkit-esp32c5
            target: esp32c5
            profile: ""
          - board: xiao-esp32c5
            target: esp32c5
            profile: boards/xiao-esp32c5.defaults
          - board: xiao-esp32c6
            target: esp32c6
            profile: boards/xiao-esp32c6.defaults
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: ${{ matrix.target }}
          command: >-
            idf.py
            ${{ matrix.profile && format('-DSDKCONFIG_DEFAULTS="sdkconfig.defaults;{0}"', matrix.profile) || '' }}
            build

      - name: Collect the flashable parts
        run: |
          python3 tools/collect_release.py \
            --target ${{ matrix.target }} --board ${{ matrix.board }} --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.board }}
          path: dist/
          retention-days: 1

  publish:
    name: Attach to the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Build the manifest
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          # Deliberately NOT a single merged image.
          #
          # `esptool merge_bin` pads the gaps between the parts with 0xFF, and
          # the NVS partition sits at 0x9000 -- inside that span. Flashing a
          # merged image therefore erases every mute rule, the Wi-Fi
          # credentials, the notifier token and the device's generated console
          # password. Shipping the parts at their own offsets means esptool
          # writes only those regions, so an upgrade keeps its settings and a
          # clean install stays an explicit choice (ESP Web Tools offers an
          # erase checkbox).
          #
          # The offsets come from each build's flash_args, never from this
          # file: the S3 bootloader lives at 0x0 and the C5 bootloader at
          # 0x2000, and a manifest that assumes one of them flashes the other
          # into a board that will not boot.
          python3 tools/make_manifest.py \
            --version "$TAG" --base "$BASE" \
            --out-dir dist 'dist/builds-*.json'

          ( cd dist && sha256sum *.bin manifest-*.json boards.json > SHA256SUMS )
          ls -l dist

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          REPO="${{ github.repository }}"

          # Create the release if it is not there yet.
          #
          # This workflow triggers on a tag push, but `gh release upload` needs
          # a release to upload *to* -- so pushing a tag on its own used to
          # build everything and then fail at the last step. The obvious
          # workaround does not work either: `gh release create --draft` does
          # not push the tag, so the build never starts, and the release page
          # shows an `untagged-<hash>` URL as the only clue.
          #
          # Created as a draft on purpose, and left that way. pages.yml
          # triggers on `release: published` while this workflow is what
          # *uploads* the assets, so publishing before the build finishes
          # deploys a site pointing at binaries that do not exist yet.
          # Draft -> build fills it -> a human publishes is the order that
          # works, and now the first step happens by itself.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            echo "creating draft release $TAG"
            gh release create "$TAG" --repo "$REPO" --draft --verify-tag \
              --title "$TAG" --generate-notes
          fi

          gh release upload "$TAG" dist/* --clobber --repo "$REPO"

          if [ "$(gh release view "$TAG" --repo "$REPO" --json isDraft -q .isDraft)" = "true" ]; then
            echo "::notice::$TAG is a draft with its assets attached. Publishing it is what deploys the flasher page."
          fi
