name: Release artifacts

# Builds the firmware for a tag and attaches it to the release, together with
# an ESP Web Tools manifest so a browser can flash it (see issue #9).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach to'
        required: true

permissions:
  contents: write

jobs:
  firmware:
    name: Build and attach firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32s3

      - name: Collect the flashable parts
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p dist

          # Deliberately NOT a single merged image.
          #
          # `esptool merge_bin` pads the gaps between the parts with 0xFF, and
          # the NVS partition sits at 0x9000 -- inside that span. Flashing a
          # merged image therefore erases every mute rule, the Wi-Fi
          # credentials, the notifier token and the device's generated console
          # password. Shipping the parts at their own offsets means esptool
          # writes only those regions, so an upgrade keeps its settings and a
          # clean install stays an explicit choice (ESP Web Tools offers an
          # erase checkbox).
          cp build/bootloader/bootloader.bin              dist/bootloader.bin
          cp build/partition_table/partition-table.bin    dist/partition-table.bin
          cp build/observore.bin                          dist/observore.bin

          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          cat > dist/manifest.json <<JSON
          {
            "name": "Observore",
            "version": "${TAG}",
            "new_install_prompt_erase": false,
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "${BASE}/bootloader.bin",       "offset": 0 },
                  { "path": "${BASE}/partition-table.bin",  "offset": 32768 },
                  { "path": "${BASE}/observore.bin",        "offset": 65536 }
                ]
              }
            ]
          }
          JSON

          python3 -c "import json,sys; json.load(open('dist/manifest.json'))"
          ( cd dist && sha256sum *.bin manifest.json > SHA256SUMS )
          ls -l dist

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release upload "$TAG" dist/* --clobber --repo "${{ github.repository }}"
