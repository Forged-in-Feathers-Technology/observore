name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The classification, scoring, muting and parsing logic is deliberately free
  # of ESP-IDF, so it compiles with a plain C compiler in seconds.  That makes
  # it cheap enough to run on every push, which is the point.
  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run the test suite
        run: make -C test test

  # The pre-commit hook that guards against committing Wi-Fi credentials is
  # installed locally and is therefore absent from a fresh clone.  This is the
  # copy that actually protects the repository.
  secrets:
    name: No credentials in tracked files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan tracked files
        run: tools/check_no_secrets.sh

  # A board profile that nothing builds is a board profile that quietly rots.
  # These describe boards rather than chips -- the C5 appears twice, once as a
  # Waveshare kit with a WS2812 and a UART bridge and once as a XIAO with a
  # plain LED and only native USB -- so the target matrix above does not cover
  # them.
  boards:
    name: Board profile (${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: xiao-esp32s3
            target: esp32s3
            profile: ""
          - board: devkit-esp32c5
            target: esp32c5
            profile: ""
          - board: xiao-esp32c5
            target: esp32c5
            profile: boards/xiao-esp32c5.defaults
          - board: xiao-esp32c6
            target: esp32c6
            profile: boards/xiao-esp32c6.defaults
    steps:
      - uses: actions/checkout@v7
      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: ${{ matrix.target }}
          command: >-
            idf.py
            ${{ matrix.profile && format('-DSDKCONFIG_DEFAULTS="sdkconfig.defaults;{0}"', matrix.profile) || '' }}
            build

      # The offsets differ per chip and the filenames per board, so this has to
      # run where both are known.
      - name: Documented flash offsets match this board
        run: python3 tools/check_docs_match_build.py --board ${{ matrix.board }}

  # Documentation has no compiler, and this project keeps proving it: renaming
  # the release assets broke the manual flashing instructions in two documents
  # and nothing noticed for a release.  These are the parts of the prose that
  # can be mechanically checked against the repository.
  #
  # No network and no published release is consulted -- a check that fails
  # because a release is mid-upload is a check people learn to ignore.
  docs:
    name: Docs match the build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check filenames and target coverage
        run: python3 tools/check_docs_match_build.py

      # The flasher page must not load its installer from someone else's
      # server. It did once, from a version that did not exist, and the page
      # responded by telling every visitor their browser was unsupported --
      # wrong in every browser, and blamed on the reader. The deploy vendors
      # the installer; this stops the page quietly going back to a CDN.
      - name: The flasher page loads no third-party scripts
        run: |
          set -euo pipefail
          if grep -nE '<script[^>]+src="https?://' web/index.html; then
            echo "::error::web/index.html loads a script from another origin;"\
                 " vendor it in pages.yml and reference it by relative path"
            exit 1
          fi
          grep -q 'src="ewt/install-button.js"' web/index.html || {
            echo "::error::web/index.html does not load the vendored installer"
            exit 1; }
          echo "ok: the page loads only same-origin scripts"

  # Catches what the host tests cannot: the radio, web and persistence layers,
  # which only exist when built against ESP-IDF.
  firmware:
    name: Firmware build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # esp32s3 is the reference board. The RISC-V targets are built so that
        # portability breaks surface here rather than months later when
        # somebody tries the port -- a RISC-V build is about a fifth larger
        # than Xtensa, which has already overflowed a partition once.
        target: [esp32s3, esp32c6, esp32c5]
    steps:
      - uses: actions/checkout@v7
      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: ${{ matrix.target }}

  # Validates the generated table against the invariants the firmware relies
  # on -- sorted, no duplicates, the two tables disjoint, indices in range.
  #
  # It deliberately does NOT download the IEEE registry to diff against.  That
  # was the first attempt and it was wrong twice over: the registry is
  # unreachable from GitHub's runners, and even when reachable it publishes new
  # assignments constantly, so the job would go red for reasons that have
  # nothing to do with this repository being correct.  Regenerating stays a
  # deliberate manual step.
  oui-table:
    name: OUI table invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate the generated table
        run: python3 tools/check_oui_table.py
