version: 2
updates:
  # Seven third-party actions run in this repository's workflows, and between
  # them they can flash firmware, read release assets and publish the site.
  # Pinning them to a major tag means a compromised or simply broken release
  # arrives silently; this makes each bump a pull request that has to pass the
  # same eleven checks as any other change.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
    groups:
      # upload-artifact and download-artifact have to move together.
      #
      # download-artifact v8 stopped unzipping unconditionally in order to
      # support direct uploads from a newer upload-artifact, so a v8 download
      # paired with a v4 upload is a combination nobody tests. They are both
      # used only in release.yml, which no pull request runs, so the mismatch
      # would first appear while cutting a release.
      #
      # Grouping them makes one pull request that can be reasoned about, and
      # exercised with a workflow_dispatch of release.yml before it lands.
      artifact-actions:
        patterns:
          - "actions/upload-artifact"
          - "actions/download-artifact"
